{% extends "base.html" %}
{% block content %}
<div class="form-container">
    <h2>إضافة صيانة لمركبة: {{ vehicle.vehicle_number }}</h2>

        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-submit">💾 حفظ</button>
    </form>
</div>
{% endblock %}
