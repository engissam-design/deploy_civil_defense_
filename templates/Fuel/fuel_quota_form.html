{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>➕ إضافة مخصص وقود جديد</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f8f9fa; }
        .container { max-width: 700px; margin: 40px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-bottom: 25px; color: #333; }
        form p { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input, select, textarea {
            width: 100%; padding: 10px; border: 1px solid #ddd;
            border-radius: 8px; outline: none;
        }
        button {
            display: block; width: 100%; padding: 12px;
            background: #28a745; color: white; border: none;
            border-radius: 8px; font-size: 16px; cursor: pointer;
        }
        button:hover { background: #218838; }
        .back-link {
            display: inline-block; margin-top: 15px; color: #007bff; text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>➕ إضافة مخصص وقود جديد</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">حفظ</button>
        </form>

        <a href="{% url 'Fuel/fuel_quota_list' %}" class="back-link">⬅ العودة لقائمة المخصصات</a>
    </div>
</body>
</html>
