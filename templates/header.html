<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .header {
      background-color: #f8f9fa;
      border-bottom: 2px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
    }

    .logo {
      display: flex;
      align-items: center;
    }

    .logo img {
      height: 60px;
      margin-left: 15px;
    }

    .info {
      text-align: right;
    }

    .info h1 {
      margin: 0;
      font-size: 20px;
      color: #333;
    }

    .info p {
      margin: 3px 0;
      font-size: 14px;
      color: #555;
    }

    @media (max-width: 600px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }
      .logo, .info {
        text-align: right;
        width: 100%;
      }
      .logo img {
        margin: 0 0 10px 0;
      }
    }
  </style>
</head>
